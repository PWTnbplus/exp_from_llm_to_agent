[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-discovery-experiment"
version = "0.1.0"
description = "Controlled LLM-only versus single-agent scientific law discovery experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "openai>=1.68.2", "requests>=2.25", "python-dotenv>=0.19", "sympy>=1.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.7"]

[project.scripts]
scientific-discovery = "scientific_discovery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
