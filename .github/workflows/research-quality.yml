name: Research quality checks
on:
  push:
    branches: ['autopilot/**']
  pull_request:
    branches: ['main']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify autopilot runner without Codex/API keys
        run: python -m unittest discover -s tests -p 'test_autopilot_harness.py' -v
      - name: Source project quality checks
        shell: bash
        run: |
          if [ -f pyproject.toml ]; then python -m pip install -e .; fi
          python -m pip install pytest
          if [ -f tests/test_llm_isolation.py ] && [ -f tests/test_agent_actions.py ] && [ -f tests/test_budget.py ] && [ -f tests/test_no_leakage.py ] && [ -f tests/test_evaluator.py ]; then
            python -m pytest -q tests
          else
            echo 'Scientific isolation/evaluator tests missing: stage gate NOT PASSED'
            exit 1
          fi
